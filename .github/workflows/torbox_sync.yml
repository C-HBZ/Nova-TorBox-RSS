name: TorBox RSS Sync

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Run sync
        env:
          API_TORBOX: ${{ secrets.API_TORBOX }}
          API_TMDB: ${{ secrets.API_TMDB }}
        run: python main.py
